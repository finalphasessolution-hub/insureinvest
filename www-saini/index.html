(function(){
  const RIGHT_GAP = 20; // AI LIVE
  const LEFT_GAP = 110; // Quick Chat (20+60+30 gap)
  function forceLayout(){
    try{
      const jaspalBtn = document.getElementById('jaspal-chat-btn');
      const jaspalWin = document.getElementById('jaspal-chat-win');
      if(jaspalBtn){
        jaspalBtn.style.setProperty('right', RIGHT_GAP+'px','important');
        jaspalBtn.style.setProperty('bottom','20px','important');
        jaspalBtn.style.setProperty('left','auto','important');
        jaspalBtn.style.setProperty('z-index','2147483647','important');
      }
      if(jaspalWin){
        jaspalWin.style.setProperty('right', RIGHT_GAP+'px','important');
        jaspalWin.style.setProperty('bottom','85px','important');
      }
      // Find ALL fixed bottom-right widgets that are NOT jaspal
      const all = document.querySelectorAll('*');
      let candidates = [];
      all.forEach(el=>{
        if(!el || el.id==='jaspal-chat-btn' || el.id==='jaspal-chat-win') return;
        if(el.closest && (el.closest('#jaspal-chat-btn') || el.closest('#jaspal-chat-win'))) return;
        const cs = window.getComputedStyle(el);
        if(cs.position!=='fixed') return;
        if(cs.display==='none' || cs.visibility==='hidden') return;
        const r = el.getBoundingClientRect();
        // must be near bottom-right corner, smallish
        if(r.width < 10 || r.height < 10) return;
        if(r.width > 500 || r.height > 500) return; // not a button
        if(r.bottom < window.innerHeight - 150) return; // not bottom
        if(r.right < window.innerWidth - 300) return; // not right
        // Avoid duplicates - only top-level fixed containers
        if(el.parentElement && window.getComputedStyle(el.parentElement).position==='fixed') return;
        candidates.push(el);
      });
      // Remove duplicates - keep only largest per area
      candidates = candidates.filter((el,i,arr)=>{
        // if parent already in list, skip child
        return !arr.some(other=> other!==el && other.contains(el));
      });
      // Move all candidates to LEFT_GAP
      candidates.forEach(el=>{
        // Skip if it's jaspal
        if(el.id && el.id.includes('jaspal')) return;
        // If it contains AI LIVE text, skip (it's our button)

        }

          if(cs.position==='fixed'){
            cur.style.setProperty('right', LEFT_GAP+'px','important');
            cur.style.setProperty('bottom','20px','important');
            cur.style.setProperty('left','auto','important');
            break;
          }
          cur = cur.parentElement;
        }
      });
    }catch(e){}
  }
  // Run aggressively
  window.addEventListener('DOMContentLoaded', forceLayout);
  window.addEventListener('load', ()=>{ forceLayout(); setTimeout(forceLayout, 500); setTimeout(forceLayout, 1500); setTimeout(forceLayout, 3000); });

  // setInterval removed
